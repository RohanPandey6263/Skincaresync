# Response headers for every page and asset the website serves.
#
# Included in each `location` of deploy/nginx.conf rather than set once on the
# server: nginx drops ALL inherited add_header directives from any location that
# sets one of its own, so /assets/ and /index.html would otherwise lose these.
# `always` sends them on error responses too.

# HTTPS only, for a year, once a browser has seen the site over HTTPS. No
# includeSubDomains or preload: those reach beyond this site and are hard to
# undo. Browsers ignore this header on plain-http responses (local compose).
add_header Strict-Transport-Security "max-age=31536000" always;

# What the page may load. Built from what the app actually uses:
#   fonts      Google Fonts stylesheet and font files
#   images     product photos come from many outside hosts (Open Beauty Facts,
#              brand CDNs), so any https image is allowed; data: for the icon
#   scripts    our own bundle, plus Cloudflare Web Analytics if it is enabled
#   connect    our own /api/, plus the analytics beacon
# Everything else, including plugins and framing by other sites, is refused.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# The camera is used by the barcode scanner, on this site only.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
