# SkincareSync: SPA + API on one origin.
#
# Serving both from the same host is a deliberate choice, not just convenience.
# The session cookie is SameSite=Lax, which browsers do NOT send on cross-site
# XHR -- so a frontend on a different registrable domain than the API silently
# fails to authenticate after sign-in. Same origin makes the cookie first-party
# and takes CORS out of the picture entirely.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client uploads nothing; analyses are bounded JSON. Keep the body small so
    # a large POST is rejected here rather than in the worker.
    client_max_body_size 256k;

    # The API sets its own cache semantics; these apply to the static bundle.
    # Hashed assets are immutable, index.html must never be cached or a deploy
    # leaves browsers pinned to a stale bundle that references deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # OVERWRITE, never append. skincaresync/ratelimit.py and
        # auth/dependencies.py both read the FIRST entry of X-Forwarded-For
        # when TRUST_PROXY=true. The usual $proxy_add_x_forwarded_for appends
        # the peer to whatever the client sent, so a client sending
        # `X-Forwarded-For: 1.2.3.4` would put a forged value in first place
        # and rotate past the rate limit at will. $remote_addr discards the
        # client's header and substitutes the real peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Product lookup fans out to DailyMed and Open Beauty Facts under an
        # 8s budget (LOOKUP_BUDGET_SECONDS); allow for that plus slack rather
        # than cutting a legitimate lookup off at nginx's 60s default.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Single-page app: the hand-written router in frontend/src/lib/router.jsx
    # owns /signin, /verify-email, /reset-password and the rest. Those paths
    # are real URLs users arrive at from email links, and there is no file
    # behind any of them -- without this fallback each one 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
