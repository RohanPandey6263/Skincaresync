# SkincareSync: SPA + API on one origin.
#
# This is a TEMPLATE. The nginx image renders it at container start
# (/etc/nginx/templates -> /etc/nginx/conf.d), substituting the uppercase placeholders
# below from deploy/nginx-env.envsh. Lowercase $variables are nginx's own and
# are left alone. Defaults reproduce the compose setup exactly; Railway (or any
# platform with its own edge proxy in front) overrides them -- see DEPLOY.md.
#
# Serving both from the same host is a deliberate choice, not just convenience.
# The session cookie is SameSite=Lax, which browsers do NOT send on cross-site
# XHR -- so a frontend on a different registrable domain than the API silently
# fails to authenticate after sign-in. Same origin makes the cookie first-party
# and takes CORS out of the picture entirely.

server {
    # The platform picks the port (Railway injects $PORT); compose uses 80.
    listen ${PORT};
    server_name _;

    # Resolve the API's address per request rather than once at startup. A
    # platform's private network hands a redeployed service a new address, and
    # an upstream resolved at boot keeps pointing at the old one -- every /api/
    # call 502s until this container restarts too. NGINX_LOCAL_RESOLVERS is
    # filled from /etc/resolv.conf by the nginx image itself.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    root /usr/share/nginx/html;

    # Compress text responses. Without this the 320 KB script bundle goes out
    # uncompressed (94 KB gzipped) unless something in front happens to
    # compress it -- Cloudflare does when proxying; Railway's edge alone does not.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json application/xml text/plain;

    # Headers shared by every location below; see deploy/security-headers.conf
    # for why each location includes them itself.
    include /etc/nginx/snippets/security-headers.conf;
    index index.html;

    # Client uploads nothing; analyses are bounded JSON. Keep the body small so
    # a large POST is rejected here rather than in the worker.
    client_max_body_size 256k;

    # The API sets its own cache semantics; these apply to the static bundle.
    # Hashed assets are immutable, index.html must never be cached or a deploy
    # leaves browsers pinned to a stale bundle that references deleted chunks.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # A variable in proxy_pass is what makes nginx use the resolver above
        # at request time. With no URI part, the request path passes through
        # unchanged, exactly as a literal `proxy_pass http://api:8000;` would.
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Who the client is. skincaresync/clientip.py reads this header when
        # TRUST_PROXY=true, counting TRUST_PROXY_HOPS entries from the right.
        #
        # When nginx is the edge (compose), FORWARDED_FOR is $remote_addr: the
        # client's own header is DISCARDED and replaced with the real peer, so
        # the list is one trustworthy entry long (TRUST_PROXY_HOPS=0).
        #
        # Behind a platform edge, $remote_addr is the edge, not the client --
        # overwriting with it would put every user in one rate-limit bucket.
        # What replaces it depends on how the edge reports the client:
        #
        # Railway reports the client ONLY in X-Real-IP, which it sets itself.
        # It does not touch X-Forwarded-For, so the client's own value of that
        # header arrives intact and is worthless. With CLIENT_IP_HEADER=
        # X-Real-IP, FORWARDED_FOR is $http_x_real_ip: the edge's value alone,
        # one entry (TRUST_PROXY_HOPS=0). Found by testing the live service:
        # the append mode below let forged addresses through on Railway.
        #
        # An edge that APPENDS to X-Forwarded-For instead: BEHIND_EDGE_PROXY=
        # true, FORWARDED_FOR is $proxy_add_x_forwarded_for, and the API counts
        # two hops from the right (TRUST_PROXY_HOPS=2).
        proxy_set_header X-Forwarded-For ${FORWARDED_FOR};
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Product lookup fans out to DailyMed and Open Beauty Facts under an
        # 8s budget (LOOKUP_BUDGET_SECONDS); allow for that plus slack rather
        # than cutting a legitimate lookup off at nginx's 60s default.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Single-page app: the hand-written router in frontend/src/lib/router.jsx
    # owns /signin, /verify-email, /reset-password and the rest. Those paths
    # are real URLs users arrive at from email links, and there is no file
    # behind any of them -- without this fallback each one 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
